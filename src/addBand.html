<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiunfa band</title>
</head>
<body>

    <form id="bandForm">
        <h2>Band</h2>
        
        <label>ID:</label>
        <input type="number" name="id" required />
<br><br>
        <label>Band Name:</label>
        <input type="text" name="bandname" required />
<br><br>
        <h2>Album</h2>
        <label>Title:</label>
        <input type="text" name="albumTitle" required />
<br><br>
        <label>Year:</label>
        <input type="number" name="albumYear" required />
<br><br>
        <label>Cover URL:</label>
        <input type="url" name="albumCover" required />
<br><br>
        <label>YouTube Link:</label>
        <input type="url" name="albumYt" required />
<br><br>
        <h2>Tracks</h2>
        <div id="tracksContainer">
            <input type="" name="tracks[]" placeholder="Track name" required />
        </div>

        <br><br>
        <button type="submit">Salva</button>
    </form>
    
</body>
</html>
